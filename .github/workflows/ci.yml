name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests bench
      - run: ruff format --check src tests bench
      - run: python bench/build_corpus.py
      - run: pytest -m "not network" --cov=sniffdog --cov-report=term-missing

  live-registry:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -m network
      - name: Self-audit the repo's own dependencies
        run: sniffdog audit . --deep --fail-on critical

  dogfood-action:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          command: scan
          args: "bench/corpus/benign/py-api-client-token bench/corpus/benign/js-http-client-env"
          fail-on: high
