name: "Sniffdog supply-chain scan"
description: "Sniff out malicious dependencies (PyPI + npm): taint analysis, deobfuscation, typosquat and dependency-confusion checks. Uploads SARIF to Code Scanning."
author: "Manav"
branding:
  icon: "shield"
  color: "orange"

inputs:
  command:
    description: "audit (lockfiles/manifests), scan (packages or paths) or diff"
    default: "audit"
  args:
    description: "Arguments for the command, e.g. '. --deep' or 'pypi:requests==2.32.3'"
    default: ". --deep"
  fail-on:
    description: "Fail the job if any finding is at or above this severity (info|low|medium|high|critical)"
    default: "high"
  upload-sarif:
    description: "Upload results to GitHub Code Scanning"
    default: "true"
  comment-summary:
    description: "Write a Markdown summary to the job summary page"
    default: "true"

outputs:
  sarif-file:
    description: "Path to the SARIF report"
    value: ${{ steps.run.outputs.sarif }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install sniffdog
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: Run sniffdog
      id: run
      shell: bash
      run: |
        set +e
        sniffdog ${{ inputs.command }} ${{ inputs.args }} --format sarif --output sniffdog.sarif --fail-on "${{ inputs.fail-on }}"
        code=$?
        if [ "${{ inputs.comment-summary }}" = "true" ]; then
          sniffdog ${{ inputs.command }} ${{ inputs.args }} --format markdown --fail-on critical >> "$GITHUB_STEP_SUMMARY" || true
        fi
        echo "sarif=sniffdog.sarif" >> "$GITHUB_OUTPUT"
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' && always() }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: sniffdog.sarif
        category: sniffdog
    - name: Enforce policy
      shell: bash
      run: |
        code="${{ steps.run.outputs.exit_code }}"
        if [ "$code" != "0" ]; then echo "::error::sniffdog found findings at or above '${{ inputs.fail-on }}' (exit $code)"; exit "$code"; fi
